<svg
  viewBox="0 0 800 500"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Error en Akkab</title>
  <desc id="desc">Ilustración de error para páginas 400 y 500 de Akkab.</desc>

  <defs>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ÓRBITAS DESALINEADAS (sistema) -->
  <g transform="translate(200, 140)">
    <circle cx="200" cy="120" r="90"
            stroke="#10B981"
            stroke-width="6"
            fill="none"
            opacity="0.25" />

    <circle cx="220" cy="120" r="120"
            stroke="#3B82F6"
            stroke-width="4"
            fill="none"
            stroke-dasharray="14 12"
            opacity="0.25" />

    <circle cx="190" cy="120" r="150"
            stroke="#F97316"
            stroke-width="3"
            fill="none"
            stroke-dasharray="10 14"
            opacity="0.25" />
  </g>

  <!-- TARJETAS FLOTANTES (desorden leve) -->
  <g filter="url(#softShadow)">
    <rect x="160" y="220" width="120" height="70" rx="14"
          fill="#FFFFFF" stroke="#E5E7EB"
          transform="rotate(-4 160 220)" />

    <rect x="500" y="190" width="140" height="80" rx="16"
          fill="#FFFFFF" stroke="#E5E7EB"
          transform="rotate(5 500 190)" />

    <rect x="330" y="300" width="160" height="90" rx="18"
          fill="#FFFFFF" stroke="#E5E7EB"
          transform="rotate(-2 330 300)" />
  </g>

  <!-- ICONO CENTRAL DE ERROR (suave) -->
  <g transform="translate(360, 200)">
    <circle cx="40" cy="40" r="40"
            fill="#F97316"
            opacity="0.12" />

    <path d="M40 18 L40 46"
          stroke="#F97316"
          stroke-width="6"
          stroke-linecap="round" />

    <circle cx="40" cy="58" r="4"
            fill="#F97316" />
  </g>

  <!-- PEQUEÑOS DETALLES -->
  <circle cx="120" cy="120" r="6" fill="#10B981" opacity="0.5" />
  <circle cx="680" cy="90" r="8" fill="#3B82F6" opacity="0.4" />
  <circle cx="720" cy="360" r="10" fill="#F97316" opacity="0.35" />

</svg>
