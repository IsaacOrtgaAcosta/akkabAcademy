<svg
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Error de servidor o conexión</title>
  <desc id="desc">Ilustración de error técnico por servidor o conexión en Akkab.</desc>

  <defs>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- SERVIDOR CENTRAL -->
  <g transform="translate(350, 140)" filter="url(#softShadow)">
    <rect x="0" y="0" width="100" height="120" rx="16"
          fill="#FFFFFF" stroke="#E5E7EB" />

    <!-- líneas de estado -->
    <rect x="20" y="26" width="60" height="8" rx="4" fill="#10B981" />
    <rect x="20" y="44" width="60" height="8" rx="4" fill="#3B82F6" />
    <rect x="20" y="62" width="60" height="8" rx="4" fill="#F97316" />

    <!-- indicador apagado -->
    <circle cx="50" cy="96" r="6" fill="#9CA3AF" />
  </g>

  <!-- CONEXIONES CORTADAS -->
  <g stroke-linecap="round">
    <!-- izquierda -->
    <line x1="300" y1="200" x2="250" y2="200"
          stroke="#3B82F6" stroke-width="4"
          stroke-dasharray="8 10" opacity="0.4" />

    <!-- derecha -->
    <line x1="450" y1="200" x2="500" y2="200"
          stroke="#10B981" stroke-width="4"
          stroke-dasharray="8 10" opacity="0.4" />

    <!-- arriba -->
    <line x1="400" y1="120" x2="400" y2="80"
          stroke="#F97316" stroke-width="4"
          stroke-dasharray="8 10" opacity="0.4" />
  </g>

  <!-- ICONO DE ERROR / ADVERTENCIA -->
  <g transform="translate(385, 90)">
    <circle cx="15" cy="15" r="15"
            fill="#F97316" opacity="0.18" />

    <path d="M15 6 L15 17"
          stroke="#F97316"
          stroke-width="3"
          stroke-linecap="round" />

    <circle cx="15" cy="22" r="2"
            fill="#F97316" />
  </g>

  <!-- SEÑALES DE INTERFERENCIA -->
  <g opacity="0.4">
    <circle cx="180" cy="160" r="6" fill="#3B82F6" />
    <circle cx="620" cy="170" r="8" fill="#10B981" />
    <circle cx="650" cy="300" r="10" fill="#F97316" />
    <circle cx="150" cy="300" r="7" fill="#9CA3AF" />
  </g>

</svg>
